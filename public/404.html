<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cro&amp;Txet</title>
  <!--
    SPA fallback for GitHub Pages (staging only).
    Encodes the requested deep link into a query string and redirects to the
    app root, where a small script in index.html restores the real URL.
    Based on the standard spa-github-pages trick (rafgraph/spa-github-pages).
  -->
  <script>
    var pathSegmentsToKeep = 1; // keep "/Cro-Txet"
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
